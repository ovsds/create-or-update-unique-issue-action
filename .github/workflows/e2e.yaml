name: E2E

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  e2e-default:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      issue-title-prefix: "E2E ${{ github.run_number }}.${{ github.run_attempt }} - Default"
      issue-body: "This is a test issue for the E2E Default workflow"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find Issue Before
        id: find-issue-before
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_INCLUDES: ${{ env.issue-title-prefix }}
        run: |
          set -euo pipefail
          issues="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(.pull_request == null and (.title | contains($ENV.TITLE_INCLUDES))) | .number' \
              | jq --slurp --compact-output '.'
          )"
          echo "issues=${issues}" >> "${GITHUB_OUTPUT}"

      - name: Assert issue not found
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.find-issue-before.outputs.issues }}
          expected: "[]"

      - name: Test Run Create Issue
        id: test-run-create-issue
        uses: $/
        with:
          title: "${{ env.issue-title-prefix }} - Create"
          body: "${{ env.issue-body }} - Create"
          unique-title-includes: ${{ env.issue-title-prefix }}

      - name: Wait for Issue Listed
        uses: $/.github/actions/wait_issue_listed
        with:
          issue-number: ${{ steps.test-run-create-issue.outputs.issue-number }}

      - name: Get Issue Created
        id: get-issue-created
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.test-run-create-issue.outputs.issue-number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '"issue-title=\(.title)", "issue-body=\(.body)", "issue-state=\(.state)"' >> "${GITHUB_OUTPUT}"

      - name: Assert issue title
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-created.outputs.issue-title }}
          expected: "${{ env.issue-title-prefix }} - Create"

      - name: Assert issue body
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-created.outputs.issue-body }}
          expected: "${{ env.issue-body }} - Create"

      - name: Assert issue state
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-created.outputs.issue-state }}
          expected: "open"

      - name: Test Run Update Issue
        id: test-run-update-issue
        uses: $/
        with:
          title: "${{ env.issue-title-prefix }} - Update"
          body: "${{ env.issue-body }} - Update"
          unique-title-includes: ${{ env.issue-title-prefix }}

      - name: Get Issue Updated
        id: get-issue-updated
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.test-run-update-issue.outputs.issue-number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '"issue-title=\(.title)", "issue-body=\(.body)", "issue-state=\(.state)"' >> "${GITHUB_OUTPUT}"

      - name: Assert issue title
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-updated.outputs.issue-title }}
          expected: "${{ env.issue-title-prefix }} - Update"

      - name: Assert issue body
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-updated.outputs.issue-body }}
          expected: "${{ env.issue-body }} - Update"

      - name: Assert issue state
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-updated.outputs.issue-state }}
          expected: "open"

      - name: Test Run Close Issue
        id: test-run-close-issue
        uses: $/
        with:
          title: "${{ env.issue-title-prefix }} - Close"
          body: "${{ env.issue-body }} - Close"
          unique-title-includes: ${{ env.issue-title-prefix }}
          close: "true"

      - name: Get Issue Closed
        id: get-issue-closed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.test-run-close-issue.outputs.issue-number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '"issue-title=\(.title)", "issue-body=\(.body)", "issue-state=\(.state)"' >> "${GITHUB_OUTPUT}"

      - name: Assert issue title
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-closed.outputs.issue-title }}
          expected: "${{ env.issue-title-prefix }} - Close"

      - name: Assert issue body
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-closed.outputs.issue-body }}
          expected: "${{ env.issue-body }} - Close"

      - name: Assert issue state
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-closed.outputs.issue-state }}
          expected: "closed"

      - name: Get Issue Close Reason
        id: get-issue-close-reason
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.test-run-close-issue.outputs.issue-number }}
        run: |
          set -euo pipefail
          result="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq '.state_reason')"
          echo "result=${result}" >> "${GITHUB_OUTPUT}"

      - name: Assert issue close reason
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-close-reason.outputs.result }}
          expected: "not_planned"

  e2e-close-non-existing:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      issue-title-prefix: "E2E ${{ github.run_number }}.${{ github.run_attempt }} - Close Non Existing"
      issue-body: "This is a test issue for the E2E Close Non Existing workflow"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find Issue Before
        id: find-issue-before
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_INCLUDES: ${{ env.issue-title-prefix }}
        run: |
          set -euo pipefail
          issues="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(.pull_request == null and (.title | contains($ENV.TITLE_INCLUDES))) | .number' \
              | jq --slurp --compact-output '.'
          )"
          echo "issues=${issues}" >> "${GITHUB_OUTPUT}"

      - name: Assert issue not found
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.find-issue-before.outputs.issues }}
          expected: "[]"

      - name: Test Run Close Issue
        id: test-run-close-issue
        uses: $/
        with:
          title: "${{ env.issue-title-prefix }} - Close"
          body: "${{ env.issue-body }} - Close"
          unique-title-includes: ${{ env.issue-title-prefix }}
          close: "true"

      - name: Find Issue Closed
        id: find-issue-closed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_INCLUDES: ${{ env.issue-title-prefix }}
        run: |
          set -euo pipefail
          issues="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              --jq '.[] | select(.pull_request == null and (.title | contains($ENV.TITLE_INCLUDES))) | .number' \
              | jq --slurp --compact-output '.'
          )"
          echo "issues=${issues}" >> "${GITHUB_OUTPUT}"

      - name: Assert issue not found
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.find-issue-closed.outputs.issues }}
          expected: "[]"

  e2e-closed-not-reopen:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      issue-title-prefix: "E2E ${{ github.run_number }}.${{ github.run_attempt }} - Closed Not Reopen"
      issue-body: "This is a test issue for the E2E Closed Not Reopen workflow"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Run Create Issue
        id: test-run-create-issue
        uses: $/
        with:
          title: "${{ env.issue-title-prefix }} - Create"
          body: "${{ env.issue-body }} - Create"
          unique-title-includes: ${{ env.issue-title-prefix }}

      - name: Wait for Issue Listed
        uses: $/.github/actions/wait_issue_listed
        with:
          issue-number: ${{ steps.test-run-create-issue.outputs.issue-number }}

      - name: Test Run Close Issue
        id: test-run-close-issue
        uses: $/
        with:
          title: "${{ env.issue-title-prefix }} - Close"
          body: "${{ env.issue-body }} - Close"
          unique-title-includes: ${{ env.issue-title-prefix }}
          close: "true"

      - name: Get Issue Closed
        id: get-issue-closed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.test-run-close-issue.outputs.issue-number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '"issue-title=\(.title)", "issue-body=\(.body)", "issue-state=\(.state)"' >> "${GITHUB_OUTPUT}"

      - name: Assert issue closed
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-closed.outputs.issue-state }}
          expected: "closed"

      - name: Wait for Issue Not Listed
        uses: $/.github/actions/wait_issue_listed
        with:
          issue-number: ${{ steps.test-run-close-issue.outputs.issue-number }}
          listed: "false"

      - name: Test Run Reopen Issue
        id: test-run-reopen-issue
        uses: $/
        with:
          title: "${{ env.issue-title-prefix }} - Reopen"
          body: "${{ env.issue-body }} - Reopen"
          unique-title-includes: ${{ env.issue-title-prefix }}

      - name: Get Issue Closed
        id: get-issue-closed-again
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.test-run-close-issue.outputs.issue-number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '"issue-title=\(.title)", "issue-body=\(.body)", "issue-state=\(.state)"' >> "${GITHUB_OUTPUT}"

      - name: Assert issue closed
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-closed-again.outputs.issue-state }}
          expected: "closed"

      - name: Get Issue Reopened
        id: get-issue-reopened
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.test-run-reopen-issue.outputs.issue-number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '"issue-title=\(.title)", "issue-body=\(.body)", "issue-state=\(.state)"' >> "${GITHUB_OUTPUT}"

      - name: Assert issue reopened
        uses: nick-fields/assert-action@0efd6166067d9c59d89c710fab4f79fb066f8985 # v4.0.1
        with:
          actual: ${{ steps.get-issue-reopened.outputs.issue-state }}
          expected: "open"

  e2e-cleanup:
    runs-on: ubuntu-latest
    if: always()

    permissions:
      issues: write

    needs:
      - e2e-default
      - e2e-close-non-existing
      - e2e-closed-not-reopen

    steps:
      - name: Close e2e issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_PREFIX: "E2E ${{ github.run_number }}."
        run: |
          set -euo pipefail
          issue_numbers="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null and (.title | startswith($ENV.TITLE_PREFIX))) | .number'
          )"
          failed=0
          for issue_number in ${issue_numbers}; do
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" -f state=closed --silent ||
              failed=1
          done
          exit "${failed}"

  e2e:
    runs-on: ubuntu-latest
    if: always() && !cancelled()

    permissions: {}

    needs:
      - e2e-default
      - e2e-close-non-existing
      - e2e-closed-not-reopen
      - e2e-cleanup

    steps:
      - name: Collect Results
        uses: ovsds/collect-needs-result-action@12190e2a1bfe85d9c024f190a3833973e97998f8 # v1.0.0
        with:
          needs_json: ${{ toJson(needs) }}
          skip_allowed: false
