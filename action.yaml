name: "Create Or Update Unique Issue"
description: "Create or Update Unique Issue Action"

inputs:
  token:
    description: "GITHUB_TOKEN or a repo scoped PAT"
    default: ${{ github.token }}
  title:
    description: "The title of the issue to create or update"
    required: true
  body:
    description: "The body of the issue to create or update"
    required: true
  unique-title-includes:
    description: "The unique title to search for in the repository"
    required: true
  close:
    description: "Close the comment or skip creation"
    default: "false"

outputs:
  issue-number:
    description: "The ID of the issue created or updated"
    value: ${{ steps.result.outputs.issue-number }}

runs:
  using: "composite"
  steps:
    - name: Find issue
      id: find-issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        UNIQUE_TITLE_INCLUDES: ${{ inputs.unique-title-includes }}
      run: |
        set -euo pipefail
        issue_numbers="$(
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and (.title | contains($ENV.UNIQUE_TITLE_INCLUDES))) | .number'
        )"
        echo "issue-number=$(printf '%s\n' "${issue_numbers}" | sed -n '1p')" >> "${GITHUB_OUTPUT}"

    - name: Create Issue
      if: steps.find-issue.outputs.issue-number == '' && inputs.close != 'true'
      id: create-issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
      run: |
        set -euo pipefail
        if [ -z "${TITLE}" ]; then
          echo "::warning::Issue title is empty, skipping issue creation"
          exit 0
        fi
        issue_number="$(
          gh api "repos/${GITHUB_REPOSITORY}/issues" -f "title=${TITLE}" -f "body=${BODY}" --jq '.number'
        )"
        echo "issue-number=${issue_number}" >> "${GITHUB_OUTPUT}"

    - name: Update Issue
      if: steps.find-issue.outputs.issue-number != ''
      id: update-issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ steps.find-issue.outputs.issue-number }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
      run: |
        set -euo pipefail
        args=(--method PATCH --silent)
        if [ -n "${TITLE}" ]; then args+=(-f "title=${TITLE}"); fi
        if [ -n "${BODY}" ]; then args+=(-f "body=${BODY}"); fi
        gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" "${args[@]}"

    - name: Close Issue
      if: steps.find-issue.outputs.issue-number != '' && inputs.close == 'true'
      id: close-issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ steps.find-issue.outputs.issue-number }}
      run: |
        set -euo pipefail
        gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
          -f state=closed -f state_reason=not_planned --silent

    - name: Result
      shell: bash
      id: result
      env:
        FOUND_ISSUE_NUMBER: ${{ steps.find-issue.outputs.issue-number }}
        CREATED_ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue-number }}
      run: |
        set -euo pipefail
        echo "issue-number=${FOUND_ISSUE_NUMBER:-${CREATED_ISSUE_NUMBER}}" >> "${GITHUB_OUTPUT}"

branding:
  icon: "check-square"
  color: "gray-dark"
